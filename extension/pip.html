<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>MultiPiP</title>
  <link rel="stylesheet" href="pip.css">
</head>
<body>
  <video id="video" autoplay muted playsinline></video>

  <div id="overlay" hidden>
    <p id="overlay-text"></p>
    <button id="overlay-btn" hidden>重新連線</button>
  </div>

  <header id="topbar" class="bar">
    <span id="src-title" title=""></span>
    <button id="pin" class="pin" data-state="pending" title="切換此小窗是否保持在最上方">
      <span class="dot"></span><span id="pin-label">置頂中…</span>
    </button>
    <button id="close" title="關閉小窗 (Esc)">✕</button>
  </header>

  <div id="pin-error" hidden></div>

  <footer id="controls" class="bar">
    <button id="play" title="播放／暫停 (空白鍵)">▶</button>
    <span id="time">0:00</span>
    <input id="seek" type="range" min="0" max="0" step="0.1" value="0" title="進度 (← →)">
    <span id="dur">--:--</span>
    <button id="mute" title="靜音 (M)">🔊</button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="1" title="音量 (↑ ↓)">
  </footer>

  <script src="pip.js"></script>
</body>
</html>
